name: sdk-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.6
      - name: Lint
        run: ruff check . --config ruff.toml

  sdk-contracts:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - name: Install SDK with test extras
        run: pip install -e .[test]
      - name: Verify package imports cleanly
        run: python -c "import aindy_sdk; print('OK')"
      - name: Run SDK test suite
        run: pytest tests/ -q
      - name: Build and check distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
